server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Roboflow 프록시 추가
    location /roboflow/ {
        proxy_pass https://serverless.roboflow.com/;
        proxy_set_header Host serverless.roboflow.com;
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
    }
    location /api/partner/health {
    proxy_pass http://127.0.0.1:3001/health;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
} 
    location  /api/partner/apply {
        proxy_pass http://127.0.0.1:3001/api/partner/apply;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 객석심사 API / 실시간 무대화면(SSE)
    location /api/judge/ {
        # URI를 그대로 Node :3001로 전달
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 실시간 전송을 위해 버퍼/캐시 비활성화
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /gemini/ {
        proxy_pass https://generativelanguage.googleapis.com/;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
    }
    
    # 행사 운영 중 프론트엔드 구버전이 브라우저에 남지 않도록 SPA HTML 캐시 방지
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location = / {
        try_files /nanumieum_portal.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}