<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나눔이음 물품기부자 신청하기 | 나눔이음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --yellow:#F6C640;--yellow-soft:#FFF3D2;--yellow-dark:#B5860E;
    --line:#F0E1E6;--card:#FFFFFF;--gray:#8A7D85;
    --r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:760px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  .lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:1040px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none}
  .dback:hover{color:var(--ink)}

  .banner{
    background:linear-gradient(135deg,var(--yellow-soft) 0%,var(--paper-2) 55%,var(--paper-2) 100%);
    position:relative;overflow:hidden;padding:52px 0 46px;
  }
  .banner .inner{max-width:1040px;margin:0 auto;width:100%;padding:0 24px;position:relative;z-index:2}
  .banner .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--yellow-dark);
    background:#fff;padding:7px 16px;border-radius:100px;margin-bottom:16px;
  }
  .banner .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow)}
  .banner h1{
    font-family:var(--serif);font-size:clamp(22px,3.4vw,32px);font-weight:700;line-height:1.5;
    color:var(--ink);letter-spacing:-.02em;margin-bottom:10px;
  }
  .banner p{font-size:14.5px;color:var(--ink-soft);max-width:520px}
  .banner .heart{position:absolute;opacity:.8;pointer-events:none}

  .info-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:34px 0 6px}
  @media(max-width:640px){.info-row{grid-template-columns:1fr}}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
  .info-card b{display:block;font-size:14.5px;font-weight:700;margin-bottom:5px}
  .info-card span{font-size:12.5px;color:var(--ink-soft);line-height:1.6}

  .section{padding:30px 0 10px}
  .sec-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:26px}
  .sec-head h2{font-size:20px;font-weight:800}
  .sec-head span{font-size:13.5px;color:var(--gray);display:block;margin-top:4px}

  .field{margin-bottom:22px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
  .field label em{color:var(--red);font-style:normal;margin-left:2px}
  .field input, .field textarea, .field select{
    width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:13px 15px;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--card);outline:none;transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--yellow-dark)}
  .phone-row{display:flex;gap:8px;align-items:center}
  .phone-row select{max-width:110px;flex:none}
  .phone-row span{color:var(--ink-faint)}

  .submit{
    display:block;width:100%;background:var(--yellow-dark);color:#fff;border:0;
    padding:17px;font-size:16px;font-weight:700;border-radius:var(--r-sm);
    cursor:pointer;font-family:inherit;transition:background .15s;margin:8px 0 60px;
  }
  .submit:hover{background:#96700B}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center}
  footer a{color:var(--ink-faint);text-decoration:none;margin:0 10px}
  footer a:hover{color:#fff}
</style>
</head>
<body>

<nav class="dnav">
  <div class="dnav-in">
    <a href="nanumieum_portal.html" class="dbrand">나눔<em>이음</em></a>
    <a href="nanumieum_portal.html" class="dback"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 포털로 돌아가기</a>
  </div>
</nav>

<section class="banner">
  <svg class="heart" style="top:20%;left:6%;width:24px" viewBox="0 0 24 24" fill="var(--yellow-dark)"><path d="M12 21s-7.5-4.6-10.2-9.1C.2 9.1 1 5.6 4.2 4.4c2-.8 4.1 0 5.3 1.7l2.5 3.5 2.5-3.5c1.2-1.7 3.3-2.5 5.3-1.7 3.2 1.2 4 4.7 2.4 7.5C19.5 16.4 12 21 12 21z"/></svg>
  <svg class="heart" style="bottom:16%;right:8%;width:30px" viewBox="0 0 24 24" fill="var(--thread)"><path d="M12 21s-7.5-4.6-10.2-9.1C.2 9.1 1 5.6 4.2 4.4c2-.8 4.1 0 5.3 1.7l2.5 3.5 2.5-3.5c1.2-1.7 3.3-2.5 5.3-1.7 3.2 1.2 4 4.7 2.4 7.5C19.5 16.4 12 21 12 21z"/></svg>
  <div class="inner">
    <p class="eyebrow">나눔이음 물품기부자 신청</p>
    <h1>나눔이음 물품기부자 신청하기</h1>
    <p>재고나 반품을 전국 복지시설에 기부하고 싶으신 분은 아래 정보를 남겨주세요.</p>
  </div>
</section>

<div class="wrap">
  <div class="info-row">
    <div class="info-card"><b>무엇을 하나요</b><span>나눔이음바자에 기부 물품을 등록합니다</span></div>
    <div class="info-card"><b>비용이 드나요</b><span>등록에 별도 비용이 없습니다</span></div>
  </div>

  <div class="section">
    <div class="sec-head">
      <h2>물품기부자 정보 입력</h2>
      <span>아래 정보를 남겨주시면 담당자가 확인 후 연락드립니다.</span>
    </div>

    <form id="sellerForm">
      <div class="field">
        <label for="selName">물품기부자명<em>*</em></label>
        <input type="text" id="selName" placeholder="상호명 또는 물품기부자명을 입력해 주세요" required>
      </div>
      <div class="field">
        <label for="selUrl">온라인샵 URL<em>*</em></label>
        <input type="text" id="selUrl" placeholder="https://" required>
      </div>
      <div class="field">
        <label for="selManager">담당자<em>*</em></label>
        <input type="text" id="selManager" placeholder="담당자 성함을 입력해 주세요" required>
      </div>
      <div class="field">
        <label for="selTelMid">연락처<em>*</em></label>
        <div class="phone-row">
          <select id="selTelFirst"><option>010</option><option>011</option><option>016</option><option>017</option></select>
          <span>-</span>
          <input type="text" id="selTelMid" maxlength="4" placeholder="0000" style="max-width:110px">
          <span>-</span>
          <input type="text" id="selTelLast" maxlength="4" placeholder="0000" style="max-width:110px">
        </div>
      </div>

      <button type="submit" class="submit">나눔이음 물품기부자 신청하기</button>
    </form>
  </div>
</div>

<footer>
  <p>나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example</p>
  <p style="margin-top:8px"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="nanumieum_portal.html">포털로 돌아가기</a></p>
</footer>

<script>
  document.getElementById('sellerForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const selName = document.getElementById('selName').value.trim();
    const selUrl = document.getElementById('selUrl').value.trim();
    const selManager = document.getElementById('selManager').value.trim();
    const telMid = document.getElementById('selTelMid').value.trim();
    const telLast = document.getElementById('selTelLast').value.trim();

    if(!selName || !selUrl || !selManager || telMid.length!==4 || telLast.length!==4){
      alert('필수 항목을 모두 정확히 입력해 주세요.');
      return;
    }
    alert(`나눔이음 물품기부자 신청이 접수되었습니다.\n${selName} 담당자 ${selManager}님, 담당자가 확인 후 연락드리겠습니다.\n감사합니다.`);
    location.href = 'nanumieum_portal.html';
  });
</script>
</body>
</html>
