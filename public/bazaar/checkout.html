<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/fonts.css">
<title>주문/결제 | 나눔이음바자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --line:#F0E1E6;--card:#FFFFFF;--r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:680px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  .lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:var(--wrap);margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:5px}

  h1{font-family:var(--serif);font-size:21px;font-weight:700;margin:30px 0 22px;letter-spacing:-.01em}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:16px}
  .sec h2{font-size:14.5px;font-weight:800;margin-bottom:16px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field label em{color:var(--red);font-style:normal;margin-left:2px}
  .field input, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;
    font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--thread)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.field-row{grid-template-columns:1fr}}

  .oline{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .oline:last-child{border-bottom:none}
  .oline .n{color:var(--ink-soft)}

  .paysum{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:6px;border-top:1px solid var(--line)}
  .paysum b{font-family:var(--serif);font-size:20px;color:var(--red-dark)}

  .submit-btn{
    display:block;width:100%;padding:16px;border:0;border-radius:var(--r-sm);
    background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;margin:20px 0 50px;
  }
  .submit-btn:hover{background:#000}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center}

/* =========================================================
   공통 글로벌 헤더
   ========================================================= */
.global-header{
  height:78px;
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,250,247,.84);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(115,84,68,.08);
}
.global-header *{box-sizing:border-box}
.global-header .g-shell{
  width:min(calc(100% - 48px),1180px);
  height:100%;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:28px;
}
.global-brand{
  font-family:var(--font-display,'Jalnan',sans-serif)!important;
  font-size:27px!important;
  font-weight:400!important;
  letter-spacing:-.08em!important;
  line-height:1!important;
  white-space:nowrap;
  color:#11192a!important;
  text-decoration:none!important;
}
.global-brand span{color:#11192a!important;font:inherit!important}
.global-brand b{color:#f4476b!important;font:inherit!important;font-weight:400!important}
.global-nav-links{
  display:flex;
  align-items:center;
  gap:28px;
  margin-left:auto;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
}
.global-nav-links a{
  position:relative;
  color:#11192a!important;
  opacity:.78;
  font:inherit!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-nav-links a:hover{opacity:1}
.global-nav-links a.is-current{color:#f4476b!important;opacity:1}
.global-nav-links a.is-current::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-12px;
  height:2px;border-radius:999px;background:#ee6f93;
}
.global-header-cta{
  margin-left:6px;
  padding:10px 17px!important;
  border-radius:999px!important;
  background:#11192a!important;
  color:#fff!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:12px!important;
  font-weight:700!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-menu-btn{
  display:none;
  margin-left:auto;
  width:40px;height:40px;
  border:0;background:transparent;padding:8px;cursor:pointer;
}
.global-menu-btn span{
  display:block;height:2px;margin:6px 0;background:#11192a;border-radius:999px;
}
.global-mobile-nav{
  display:none;
  position:fixed;
  z-index:1001;
  left:14px;right:14px;top:72px;
  padding:12px;
  border:1px solid rgba(102,79,67,.14);
  border-radius:20px;
  background:#fff;
  box-shadow:0 24px 60px rgba(58,42,32,.11);
}
.global-mobile-nav.open{display:block}
.global-mobile-nav a{
  display:block;
  padding:14px;
  border-radius:10px;
  color:#11192a!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
  text-decoration:none!important;
}
.global-mobile-nav a:hover{background:#f6efee}
.global-mobile-nav a.is-current{color:#f4476b!important}

/* 페이지별 원래 바자 서브메뉴 */
.bazaar-subnav{
  position:sticky;
  top:78px;
  z-index:900;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line,#F0E1E6);
}
.bazaar-subnav-in{
  width:min(calc(100% - 48px),1180px);
  min-height:56px;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:18px;
  font-family:var(--sans,'SUIT Variable','SUIT',sans-serif);
}
.bazaar-subnav a{text-decoration:none}
.subnav-back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:0 12px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.subnav-back:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.subnav-back svg{width:14px;height:14px}

.bazaar-main-links{
  display:flex;
  align-items:center;
  gap:8px;
}
.bazaar-main-links a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-main-links a:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-links a.on{
  background:var(--ink,#2B2430);
  color:#fff!important;
}
.bazaar-main-account{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.bazaar-main-account #whoName{
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink-soft,#6B5F68);
  font-size:12.5px;
  font-weight:700;
}
.bazaar-main-account .account-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
}
.bazaar-main-account .cart-ico{
  position:relative;
  width:36px;height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-account .cart-ico svg{width:20px;height:20px}
.bazaar-main-account .logout-btn{
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:var(--paper-2,#F6EFEE);
  color:var(--ink-soft,#6B5F68);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  line-height:1;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
}

.bazaar-intro-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.bazaar-intro-actions a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-intro-actions a.primary{
  background:var(--ink,#2B2430);
  color:#fff!important;
}

@media(max-width:980px){
  .global-nav-links,.global-header-cta{display:none}
  .global-menu-btn{display:block}
}
@media(max-width:760px){
  .global-header{height:66px}
  .global-header .g-shell{width:calc(100% - 24px)}
  .global-brand{font-size:24px!important}
  .global-mobile-nav{top:66px;left:12px;right:12px}

  .bazaar-subnav{top:66px}
  .bazaar-subnav-in{
    width:100%;
    min-height:52px;
    padding:7px 12px;
  }

  .bazaar-subnav.main .bazaar-subnav-in{
    min-height:92px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  .bazaar-main-links{
    width:100%;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .bazaar-main-links::-webkit-scrollbar{display:none}
  .bazaar-main-links a{
    min-height:34px;
    padding:0 12px;
    font-size:12.5px;
    flex:none;
  }
  .bazaar-main-account{
    width:100%;
    margin-left:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .bazaar-main-account #whoName{
    flex:1 1 auto;
    min-width:0;
    max-width:none;
    font-size:12px;
  }
  .bazaar-main-account .account-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
  }
  .subnav-back{
    min-height:34px;
    padding:0 10px;
    font-size:12.5px;
  }
  .bazaar-intro-actions{
    width:100%;
    justify-content:flex-end;
    gap:6px;
  }
  .bazaar-intro-actions a{
    min-height:34px;
    padding:0 11px;
    font-size:12.5px;
  }
}

</style>
</head>

  <div class="g-shell">

    <a href="cart.html" class="subnav-back"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 장바구니로</a>

<div class="wrap">
  <h1>주문/결제</h1>

  <div class="sec">
    <h2>주문 상품</h2>
    <div id="orderLines"></div>
  </div>

  <form id="shipForm">
    <div class="sec">
      <h2>배송지 정보</h2>
      <div class="field">
        <label for="recvName">수령인<em>*</em></label>
        <input type="text" id="recvName" placeholder="담당자 성함을 입력해 주세요" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="recvTel">연락처<em>*</em></label>
          <input type="text" id="recvTel" placeholder="010-0000-0000" required>
        </div>
        <div class="field">
          <label for="recvZip">우편번호<em>*</em></label>
          <input type="text" id="recvZip" placeholder="12345" required>
        </div>
      </div>
      <div class="field">
        <label for="recvAddr">주소<em>*</em></label>
        <input type="text" id="recvAddr" placeholder="시설 주소를 입력해 주세요" required>
      </div>
      <div class="field">
        <label for="recvAddr2">상세주소</label>
        <input type="text" id="recvAddr2" placeholder="동/호수, 참고사항 등">
      </div>
      <div class="field">
        <label for="recvNote">배송 시 요청사항</label>
        <textarea id="recvNote" rows="2" placeholder="예: 평일 오전에 방문 부탁드립니다"></textarea>
      </div>
    </div>

    <div class="sec">
      <h2>결제 정보</h2>
      <div class="oline"><span class="n">사용 가능 잔액</span><span id="payBalance">-</span></div>
      <div class="paysum"><span>결제 금액</span><b id="payTotal">-</b></div>
    </div>

    <button type="submit" class="submit-btn">잔액으로 결제하기</button>
  </form>
</div>

<footer>
  나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example
</footer>

<script>

  (() => {
    const btn = document.getElementById('globalMenuBtn');
    const nav = document.getElementById('globalMobileNav');
    if(!btn || !nav) return;
    btn.addEventListener('click', ()=>{
      const open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    });
    nav.querySelectorAll('a').forEach(link=>{
      link.addEventListener('click', ()=>{
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      });
    });
    document.addEventListener('click', e=>{
      if(!e.target.closest('.global-header')){
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      }
    });
  })();


  function fmt(n){ return n.toLocaleString('ko-KR'); }
  const DEFAULT_FACILITY = {n:'대구보육원', t:'아동양육시설/보육원', c:'이기운 아코디언', v:'MwkipVs8cS4'};
  function getFacility(){
    try{ const raw = localStorage.getItem('nb_facility'); if(raw) return JSON.parse(raw); }catch(e){}
    return DEFAULT_FACILITY;
  }
  function getBalance(fac){
    const key = 'nb_balance_'+fac.n;
    if(localStorage.getItem(key)===null) localStorage.setItem(key, '354000');
    return parseInt(localStorage.getItem(key),10);
  }
  function setBalance(fac, val){ localStorage.setItem('nb_balance_'+fac.n, String(val)); }
  function getLedger(fac){
    const key = 'nb_ledger_'+fac.n;
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  }
  function addLedger(fac, entry){
    const list = getLedger(fac);
    list.unshift(entry);
    localStorage.setItem('nb_ledger_'+fac.n, JSON.stringify(list));
  }
  function getOrders(fac){
    const key = 'nb_orders_'+fac.n;
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
    const seed = [
      {name:'아동 간식 스낵 모음 84g x 5개', date:'2026.08.02', status:'wait'},
      {name:'기초 위생용품 세트', date:'2026.07.20', status:'sent'},
      {name:'아동 도서 30권 세트 (기부)', date:'2026.07.05', status:'done'},
    ];
    localStorage.setItem(key, JSON.stringify(seed));
    return seed;
  }
  function addOrder(fac, order){
    const list = getOrders(fac);
    list.unshift(order);
    localStorage.setItem('nb_orders_'+fac.n, JSON.stringify(list));
  }
  function getCart(){ return JSON.parse(localStorage.getItem('nb_cart')||'[]'); }
  function setCart(c){ localStorage.setItem('nb_cart', JSON.stringify(c)); }

  function getCart(){ return JSON.parse(localStorage.getItem('nb_cart')||'[]'); }
  function setCart(c){ localStorage.setItem('nb_cart', JSON.stringify(c)); }

  async function init(){
    const res = await fetch('https://backend-production-6b41.up.railway.app/api/products?limit=1000');
    const { items: PRODUCTS } = await res.json();

    const facility = getFacility();
    const cart = getCart().map(row => ({...row, p: PRODUCTS.find(x=>x.id===row.id)})).filter(r=>r.p);

    if(!cart.length){
      alert('장바구니가 비어 있습니다.');
      location.href = 'cart.html';
      return;
    }

    const orderLines = document.getElementById('orderLines');
    orderLines.innerHTML = cart.map(r => `
      <div class="oline"><span class="n">${r.p.name} × ${r.qty}</span><span>${r.p.type==='donate'?'무료':fmt(r.p.price*r.qty)+'원'}</span></div>
    `).join('');

    const total = cart.reduce((s,r)=> s + (r.p.type==='donate' ? 0 : r.p.price*r.qty), 0);
    const balance = getBalance(facility);
    document.getElementById('payBalance').textContent = fmt(balance) + '원';
    document.getElementById('payTotal').textContent = fmt(total) + '원';

    if(total > balance){
      alert('잔액이 부족합니다. 장바구니로 돌아가 수량을 조정해 주세요.');
      location.href = 'cart.html';
      return;
    }

    document.getElementById('shipForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('recvName').value.trim();
      const tel = document.getElementById('recvTel').value.trim();
      const zip = document.getElementById('recvZip').value.trim();
      const addr = document.getElementById('recvAddr').value.trim();
      if(!name || !tel || !zip || !addr){
        alert('필수 항목을 모두 입력해 주세요.');
        return;
      }

      // 잔액 차감 및 원장 기록
      if(total > 0){
        setBalance(facility, balance - total);
        addLedger(facility, {d:new Date().toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,''), src:`${cart[0].p.name}${cart.length>1?` 외 ${cart.length-1}건`:''} 구매`, amt:-total});
      }
      // 주문 내역 추가 (물품별 1건씩)
      const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'.');
      cart.forEach(r=>{
        addOrder(facility, {
          name: r.p.name + (r.p.type==='donate' ? ' (기부)' : '') + (r.qty>1?` x${r.qty}`:''),
          date: todayStr, status: 'wait',
        });
      });

      setCart([]);
      alert(`주문이 완료되었습니다.\n배송지: ${addr}\n결제금액: ${fmt(total)}원\n마이페이지에서 진행 상태를 확인할 수 있습니다.`);
      location.href = 'bazaar-mypage.html';
    });
  }
  init();
</script>
</body>
</html>
