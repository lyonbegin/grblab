<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/fonts.css">
<title>장바구니 | 나눔이음바자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --yellow-dark:#B5860E;--yellow-soft:#FFF3D2;
    --line:#F0E1E6;--card:#FFFFFF;--r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:820px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  .lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:var(--wrap);margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:5px}

  h1{font-family:var(--serif);font-size:21px;font-weight:700;margin:30px 0 20px;letter-spacing:-.01em}

  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:13.5px;
  }
  .empty a{color:var(--thread);font-weight:700;text-decoration:none}

  .citem{
    display:grid;grid-template-columns:64px 1fr auto auto auto;gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;
  }
  @media(max-width:560px){.citem{grid-template-columns:48px 1fr;grid-template-areas:"img name" "img qty" "img price";row-gap:4px}}
  .citem .cimg{width:64px;height:64px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;color:var(--ink-faint)}
  .citem .cimg svg{width:22px;height:22px}
  .citem .cname{font-size:13.5px;font-weight:700}
  .citem .ctag{font-size:11px;color:var(--ink-faint);margin-top:2px}
  .qty-ctrl{display:flex;align-items:center;border:1px solid var(--line);border-radius:100px;overflow:hidden}
  .qty-ctrl button{width:28px;height:28px;border:0;background:var(--card);font-size:14px;cursor:pointer;color:var(--ink)}
  .qty-ctrl span{width:30px;text-align:center;font-size:13px;font-weight:700}
  .citem .cprice{font-size:14px;font-weight:800;text-align:right;min-width:80px}
  .citem .cremove{background:none;border:0;color:var(--ink-faint);cursor:pointer;padding:4px}
  .citem .cremove svg{width:17px;height:17px}

  .summary{
    background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:24px;margin:26px 0 40px;
  }
  .summary .row{display:flex;justify-content:space-between;font-size:13.5px;color:#D8CFCF;padding:6px 0}
  .summary .row.total{border-top:1px solid rgba(255,255,255,.15);margin-top:8px;padding-top:14px;font-size:16px;color:#fff;font-weight:800}
  .summary .balance-note{font-size:12px;color:#D8CFCF;margin-top:6px}
  .summary .balance-note.warn{color:#FFB4C6;font-weight:700}
  .checkout-btn{
    display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:var(--r-sm);
    background:var(--thread);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    text-align:center;text-decoration:none;
  }
  .checkout-btn:disabled{background:#5A5158;cursor:not-allowed}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center}

/* =========================================================
   공통 글로벌 헤더
   ========================================================= */
.global-header{
  height:78px;
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,250,247,.84);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(115,84,68,.08);
}
.global-header *{box-sizing:border-box}
.global-header .g-shell{
  width:min(calc(100% - 48px),1180px);
  height:100%;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:28px;
}
.global-brand{
  font-family:var(--font-display,'Jalnan',sans-serif)!important;
  font-size:27px!important;
  font-weight:400!important;
  letter-spacing:-.08em!important;
  line-height:1!important;
  white-space:nowrap;
  color:#11192a!important;
  text-decoration:none!important;
}
.global-brand span{color:#11192a!important;font:inherit!important}
.global-brand b{color:#f4476b!important;font:inherit!important;font-weight:400!important}
.global-nav-links{
  display:flex;
  align-items:center;
  gap:28px;
  margin-left:auto;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
}
.global-nav-links a{
  position:relative;
  color:#11192a!important;
  opacity:.78;
  font:inherit!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-nav-links a:hover{opacity:1}
.global-nav-links a.is-current{color:#f4476b!important;opacity:1}
.global-nav-links a.is-current::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-12px;
  height:2px;border-radius:999px;background:#ee6f93;
}
.global-header-cta{
  margin-left:6px;
  padding:10px 17px!important;
  border-radius:999px!important;
  background:#11192a!important;
  color:#fff!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:12px!important;
  font-weight:700!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-menu-btn{
  display:none;
  margin-left:auto;
  width:40px;height:40px;
  border:0;background:transparent;padding:8px;cursor:pointer;
}
.global-menu-btn span{
  display:block;height:2px;margin:6px 0;background:#11192a;border-radius:999px;
}
.global-mobile-nav{
  display:none;
  position:fixed;
  z-index:1001;
  left:14px;right:14px;top:72px;
  padding:12px;
  border:1px solid rgba(102,79,67,.14);
  border-radius:20px;
  background:#fff;
  box-shadow:0 24px 60px rgba(58,42,32,.11);
}
.global-mobile-nav.open{display:block}
.global-mobile-nav a{
  display:block;
  padding:14px;
  border-radius:10px;
  color:#11192a!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
  text-decoration:none!important;
}
.global-mobile-nav a:hover{background:#f6efee}
.global-mobile-nav a.is-current{color:#f4476b!important}

/* 페이지별 원래 바자 서브메뉴 */
.bazaar-subnav{
  position:sticky;
  top:78px;
  z-index:900;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line,#F0E1E6);
}
.bazaar-subnav-in{
  width:min(calc(100% - 48px),1180px);
  min-height:56px;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:18px;
  font-family:var(--sans,'SUIT Variable','SUIT',sans-serif);
}
.bazaar-subnav a{text-decoration:none}
.subnav-back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:0 12px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.subnav-back:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.subnav-back svg{width:14px;height:14px}

.bazaar-main-links{
  display:flex;
  align-items:center;
  gap:8px;
}
.bazaar-main-links a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-main-links a:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-links a.on{
  background:var(--ink,#2B2430);
  color:#fff!important;
}
.bazaar-main-account{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.bazaar-main-account #whoName{
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink-soft,#6B5F68);
  font-size:12.5px;
  font-weight:700;
}
.bazaar-main-account .account-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
}
.bazaar-main-account .cart-ico{
  position:relative;
  width:36px;height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-account .cart-ico svg{width:20px;height:20px}
.bazaar-main-account .logout-btn{
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:var(--paper-2,#F6EFEE);
  color:var(--ink-soft,#6B5F68);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  line-height:1;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
}

.bazaar-intro-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.bazaar-intro-actions a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-intro-actions a.primary{
  background:var(--ink,#2B2430);
  color:#fff!important;
}

@media(max-width:980px){
  .global-nav-links,.global-header-cta{display:none}
  .global-menu-btn{display:block}
}
@media(max-width:760px){
  .global-header{height:66px}
  .global-header .g-shell{width:calc(100% - 24px)}
  .global-brand{font-size:24px!important}
  .global-mobile-nav{top:66px;left:12px;right:12px}

  .bazaar-subnav{top:66px}
  .bazaar-subnav-in{
    width:100%;
    min-height:52px;
    padding:7px 12px;
  }

  .bazaar-subnav.main .bazaar-subnav-in{
    min-height:92px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  .bazaar-main-links{
    width:100%;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .bazaar-main-links::-webkit-scrollbar{display:none}
  .bazaar-main-links a{
    min-height:34px;
    padding:0 12px;
    font-size:12.5px;
    flex:none;
  }
  .bazaar-main-account{
    width:100%;
    margin-left:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .bazaar-main-account #whoName{
    flex:1 1 auto;
    min-width:0;
    max-width:none;
    font-size:12px;
  }
  .bazaar-main-account .account-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
  }
  .subnav-back{
    min-height:34px;
    padding:0 10px;
    font-size:12.5px;
  }
  .bazaar-intro-actions{
    width:100%;
    justify-content:flex-end;
    gap:6px;
  }
  .bazaar-intro-actions a{
    min-height:34px;
    padding:0 11px;
    font-size:12.5px;
  }
}

</style>
</head>
<body>

<header class="global-header">
  <div class="g-shell">
    <a class="global-brand" href="../nanumieum_portal.html" aria-label="나눔이음 메인">
      <span>나눔</span><b>이음</b>
    </a>
    <nav class="global-nav-links" aria-label="나눔이음 주요 메뉴">
      <a href="../nanumieum_portal.html#cases">대표 이음 사례</a>
      <a href="../nanumieum_portal.html#together">후원과 세금혜택</a>
      <a href="../nanumieum_portal.html#archive">나눔 아카이브</a>
      <a class="is-current" href="bazaar.html" aria-current="page">나눔이음바자</a>
      <a href="../hpartners.html">병원동행 파트너스</a>
    </nav>
    <a class="global-header-cta" href="../apply-concert.html">총회 & 음악회 참석신청</a>
    <button type="button" class="global-menu-btn" id="globalMenuBtn" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="global-mobile-nav" id="globalMobileNav" aria-label="모바일 글로벌 메뉴">
    <a href="../nanumieum_portal.html#cases">대표 이음 사례</a>
    <a href="../nanumieum_portal.html#together">후원과 세금혜택</a>
    <a href="../nanumieum_portal.html#archive">나눔 아카이브</a>
    <a class="is-current" href="bazaar.html" aria-current="page">나눔이음바자</a>
    <a href="../hpartners.html">병원동행 파트너스</a>
    <a href="../apply-concert.html">총회 & 음악회 참석신청</a>
  </nav>
</header>

<nav class="bazaar-subnav" aria-label="장바구니 메뉴">
  <div class="bazaar-subnav-in">
    <a href="bazaar.html" class="subnav-back"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 상품 목록으로</a>
  </div>
</nav>

<div class="wrap">
  <h1>장바구니</h1>
  <div id="cartBody"></div>
</div>

<footer>
  나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example
</footer>

<script>

  (() => {
    const btn = document.getElementById('globalMenuBtn');
    const nav = document.getElementById('globalMobileNav');
    if(!btn || !nav) return;
    btn.addEventListener('click', ()=>{
      const open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    });
    nav.querySelectorAll('a').forEach(link=>{
      link.addEventListener('click', ()=>{
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      });
    });
    document.addEventListener('click', e=>{
      if(!e.target.closest('.global-header')){
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      }
    });
  })();


  function fmt(n){ return n.toLocaleString('ko-KR'); }
  const DEFAULT_FACILITY = {n:'대구보육원', t:'아동양육시설/보육원', c:'이기운 아코디언', v:'MwkipVs8cS4'};
  function getFacility(){
    try{ const raw = localStorage.getItem('nb_facility'); if(raw) return JSON.parse(raw); }catch(e){}
    return DEFAULT_FACILITY;
  }
  function getBalance(fac){
    const key = 'nb_balance_'+fac.n;
    if(localStorage.getItem(key)===null) localStorage.setItem(key, '354000');
    return parseInt(localStorage.getItem(key),10);
  }
  function getCart(){ return JSON.parse(localStorage.getItem('nb_cart')||'[]'); }
  function setCart(c){ localStorage.setItem('nb_cart', JSON.stringify(c)); }

  let PRODUCTS = [];

  const facility = getFacility();
  const balance = getBalance(facility);
  const body = document.getElementById('cartBody');

  function render(){
    const cart = getCart().map(row => ({...row, p: PRODUCTS.find(x=>x.id===row.id)})).filter(r=>r.p);
    if(!cart.length){
      body.innerHTML = `<div class="empty">장바구니가 비어 있습니다.<br><a href="bazaar.html">상품 보러 가기 →</a></div>`;
      return;
    }
    const itemsHtml = cart.map(r => `
      <div class="citem" data-id="${r.id}">
        <div class="cimg"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></div>
        <div>
          <div class="cname">${r.p.name}</div>
          <div class="ctag">${r.p.type==='donate' ? '기부 물품 · 무료' : r.p.seller}</div>
        </div>
        <div class="qty-ctrl">
          <button type="button" class="qminus">−</button>
          <span>${r.qty}</span>
          <button type="button" class="qplus">+</button>
        </div>
        <div class="cprice">${r.p.type==='donate' ? '무료' : fmt(r.p.price*r.qty)+'원'}</div>
        <button type="button" class="cremove" aria-label="삭제">
          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>`).join('');

    const total = cart.reduce((s,r)=> s + (r.p.type==='donate' ? 0 : r.p.price*r.qty), 0);
    const insufficient = total > balance;

    body.innerHTML = itemsHtml + `
      <div class="summary">
        <div class="row"><span>사용 가능 잔액</span><span>${fmt(balance)}원</span></div>
        <div class="row total"><span>결제 금액</span><span>${fmt(total)}원</span></div>
        ${insufficient ? `<div class="balance-note warn">잔액이 부족합니다. ${fmt(total-balance)}원이 더 필요합니다.</div>` : `<div class="balance-note">결제 후 남는 잔액 ${fmt(balance-total)}원</div>`}
        <a href="${insufficient?'#':'checkout.html'}" class="checkout-btn" id="checkoutBtn" ${insufficient?'aria-disabled="true"':''}>
          ${insufficient ? '잔액 부족' : '배송지 입력하고 주문하기'}
        </a>
      </div>`;

    body.querySelectorAll('.citem').forEach(el=>{
      const id = el.dataset.id;
      el.querySelector('.qplus').addEventListener('click', ()=>{
        const cart = getCart();
        const row = cart.find(r=>r.id===id);
        row.qty++;
        setCart(cart);
        render();
      });
      el.querySelector('.qminus').addEventListener('click', ()=>{
        let cart = getCart();
        const row = cart.find(r=>r.id===id);
        row.qty--;
        if(row.qty<=0) cart = cart.filter(r=>r.id!==id);
        setCart(cart);
        render();
      });
      el.querySelector('.cremove').addEventListener('click', ()=>{
        const cart = getCart().filter(r=>r.id!==id);
        setCart(cart);
        render();
      });
    });

    if(insufficient){
      const btn = document.getElementById('checkoutBtn');
      btn.addEventListener('click', (e)=>{ e.preventDefault(); });
    }
  }

    const res = await fetch('https://backend-production-6b41.up.railway.app/api/products?limit=1000');
    ({ items: PRODUCTS } = await res.json());
    render();
  }
  init();
</script>
