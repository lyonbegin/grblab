<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 상세 | 나눔이음바자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --yellow:#F6C640;--yellow-soft:#FFF3D2;--yellow-dark:#B5860E;
    --line:#F0E1E6;--card:#FFFFFF;--gray:#8A7D85;
    --r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:820px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  .lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:var(--wrap);margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none}
  .dback:hover{color:var(--ink)}

  .item{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:34px 0 10px}
  @media(max-width:680px){.item{grid-template-columns:1fr}}
  .item-thumb{aspect-ratio:1/1;border-radius:var(--r-lg);overflow:hidden;position:relative;background:var(--paper-2);border:1px solid var(--line)}
  .item-thumb img{width:100%;height:100%;object-fit:cover}
  .item-thumb .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:var(--ink-faint);font-size:12.5px;
  }
  .item-thumb .ph svg{width:36px;height:36px}

  .ptag{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:100px;margin-bottom:12px}
  .ptag.general{background:var(--thread-soft);color:#1F5344}
  .ptag.donate{background:var(--yellow-soft);color:var(--yellow-dark)}
  .item-name{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.5;margin-bottom:8px}
  .item-seller{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
  .item-price{font-size:26px;font-weight:800;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .item-price small{font-size:12.5px;color:var(--ink-faint);font-weight:500;margin-left:6px}

  .qty-row{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .qty-row .lbl{font-size:13px;color:var(--ink-soft);font-weight:600}
  .qty-ctrl{display:flex;align-items:center;border:1px solid var(--line);border-radius:100px;overflow:hidden}
  .qty-ctrl button{width:34px;height:34px;border:0;background:var(--card);font-size:16px;cursor:pointer;color:var(--ink)}
  .qty-ctrl span{width:36px;text-align:center;font-weight:700;font-size:14px}

  .buy-btn{
    display:block;width:100%;padding:17px;border:0;border-radius:var(--r-sm);
    font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;transition:opacity .15s;
  }
  .buy-btn.general{background:var(--ink)}
  .buy-btn.donate{background:var(--yellow-dark)}
  .buy-btn:hover{opacity:.9}
  .item-note{font-size:11.5px;color:var(--ink-faint);margin-top:12px;line-height:1.6}

  /* ── 이 구매를 하는 복지시설 소개 ── */
  .buyer-fac{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-md);padding:12px 14px;margin-top:22px;text-decoration:none;color:inherit;
    transition:border-color .15s;
  }
  .buyer-fac:hover{border-color:var(--thread)}
  .buyer-fac .bf-thumb{width:64px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--paper-2)}
  .buyer-fac .bf-thumb img{width:100%;height:100%;object-fit:cover}
  .buyer-fac .bf-text{min-width:0;flex:1}
  .buyer-fac .bf-text .k{font-size:11px;color:var(--ink-faint)}
  .buyer-fac .bf-text b{display:block;font-size:13.5px;font-weight:700}
  .buyer-fac .bf-yt{
    flex:none;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--red-dark);
  }
  .buyer-fac .bf-yt svg{width:13px;height:13px}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center;margin-top:50px}
</style>
</head>
<body>

<nav class="dnav">
  <div class="dnav-in">
    <a href="index.html" class="dbrand">나눔<em>이음</em>바자</a>
    <a href="bazaar.html" class="dback"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 상품 목록으로</a>
  </div>
</nav>

<div class="wrap">
  <div class="item">
    <div class="item-thumb" id="itemThumb">
      <div class="ph"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>상품 사진 준비중</span></div>
    </div>
    <div>
      <span class="ptag" id="itemTag"></span>
      <h1 class="item-name" id="itemName">-</h1>
      <p class="item-seller" id="itemSeller">-</p>
      <div class="item-price" id="itemPrice">-</div>

      <div class="qty-row" id="qtyRow">
        <span class="lbl">수량</span>
        <div class="qty-ctrl">
          <button type="button" id="qtyMinus">−</button>
          <span id="qtyVal">1</span>
          <button type="button" id="qtyPlus">+</button>
        </div>
      </div>

      <button type="button" class="buy-btn" id="buyBtn">-</button>
      <p class="item-note">수령 확인 시 사진 업로드가 필요합니다. 마이페이지에서 진행 상태를 확인할 수 있습니다.</p>

      <a class="buyer-fac" id="buyerFac" href="#" target="_blank" rel="noopener">
        <span class="bf-thumb"><img id="bfThumb" src="" alt=""></span>
        <span class="bf-text"><span class="k">이 물품을 구매하는 복지시설</span><b id="bfName">-</b></span>
        <span class="bf-yt">
          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>
          결연 영상 보기
        </span>
      </a>
    </div>
  </div>
</div>

<footer>
  나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example
</footer>

<script>
  function fmt(n){ return n.toLocaleString('ko-KR'); }

  async function init(){
    const res = await fetch('https://backend-production-6b41.up.railway.app/api/products?limit=1000');
    const { items: PRODUCTS } = await res.json();

    const qs = new URLSearchParams(location.search);
    const product = PRODUCTS.find(p => p.id === qs.get('id')) || PRODUCTS[0];
    if(!product) return;

    document.title = `${product.name} | 나눔이음바자`;

    const tag = document.getElementById('itemTag');
    tag.textContent = product.type==='donate' ? '기부 물품' : '일반 상품';
    tag.classList.add(product.type);

    document.getElementById('itemName').textContent = product.name;
    document.getElementById('itemSeller').textContent = `판매자 · ${product.seller}`;

    const priceEl = document.getElementById('itemPrice');
    priceEl.innerHTML = product.type==='donate'
      ? `무료 신청 ${product.limit?`<small>${product.limit}</small>`:''}`
      : `${fmt(product.price)}원`;

    const thumb = document.getElementById('itemThumb');
    const img = document.createElement('img');
    img.src = product.image;
    img.alt = product.name;
    img.onerror = () => { img.style.display = 'none'; };
    thumb.prepend(img);

    const qtyRow = document.getElementById('qtyRow');
    const qtyVal = document.getElementById('qtyVal');
    let qty = 1;
    if(product.type === 'donate'){
      qtyRow.style.display = 'none';
    } else {
      document.getElementById('qtyMinus').addEventListener('click', ()=>{
        if(qty>1){ qty--; qtyVal.textContent = qty; }
      });
      document.getElementById('qtyPlus').addEventListener('click', ()=>{
        qty++; qtyVal.textContent = qty;
      });
    }

    const buyBtn = document.getElementById('buyBtn');
    buyBtn.classList.add(product.type);
    buyBtn.textContent = product.type==='donate' ? '무료로 신청하기' : '잔액으로 구매';
    buyBtn.addEventListener('click', ()=>{
      const msg = product.type==='donate'
        ? `${product.name}을(를) 무료로 신청했습니다.`
        : `${product.name} ${qty}개를 잔액으로 구매했습니다. (${fmt(product.price*qty)}원)`;
      alert(msg + '\n마이페이지에서 진행 상태를 확인하세요.');
      location.href = 'bazaar-mypage.html';
    });
  }
  init();

  /* ── 이 물품을 구매하는 복지시설(로그인 시설) 정보 — 실제 유튜브 썸네일 사용 ── */
  const BUYER_FACILITY = {n:'대구보육원', c:'이기운 아코디언', v:'MwkipVs8cS4'};
  document.getElementById('bfThumb').src = `https://i.ytimg.com/vi/${BUYER_FACILITY.v}/mqdefault.jpg`;
  document.getElementById('bfThumb').alt = BUYER_FACILITY.n;
  document.getElementById('bfName').textContent = `${BUYER_FACILITY.n} · ${BUYER_FACILITY.c} 결연`;
  document.getElementById('buyerFac').href = `https://www.youtube.com/watch?v=${BUYER_FACILITY.v}`;
</script>

</body>
</html>
