<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 나눔이음바자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --line:#F0E1E6;--card:#FFFFFF;--r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:420px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:1040px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none}

  .head{padding:44px 0 8px;text-align:center}
  .head .tag{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1F5344;
    background:var(--thread-soft);padding:7px 16px;border-radius:100px;margin-bottom:16px;
  }
  .head h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .head p{font-size:13.5px;color:var(--ink-soft)}

  .field{margin:22px 0}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:8px}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:13px 15px;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--card);outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--thread)}
  .field.has-error input{border-color:#C0392B}
  .field-error{color:#C0392B;font-size:12.5px;margin-top:6px;display:none}
  .field.has-error .field-error{display:block}

  .submit{
    display:block;width:100%;background:var(--thread);color:#fff;border:0;
    padding:14px;font-size:15.5px;font-weight:700;border-radius:var(--r-sm);
    cursor:pointer;font-family:inherit;transition:background .15s;margin-top:6px;
  }
  .submit:hover{background:#2E9C79}
  .submit:disabled{opacity:.6;cursor:default}

  .form-error{color:#C0392B;font-size:13px;text-align:center;margin-top:14px;display:none}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center;margin-top:60px}
</style>
</head>
<body>

<nav class="dnav">
  <div class="dnav-in">
    <a href="index.html" class="dbrand">나눔<em>이음</em>바자</a>
    <a href="index.html" class="dback">← 나눔이음바자 홈</a>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <span class="tag">복지시설 로그인</span>
    <h1>결연 복지시설로 로그인</h1>
    <p>협의체에 등록된 복지시설만 나눔이음바자를 이용할 수 있습니다.</p>
  </div>

  <form id="loginForm">
    <button type="button" class="submit test-login" id="testLoginBtn" style="background:var(--ink-faint);margin-bottom:18px">
      나눔이음지역아동센터 테스트 시설로 로그인하기
    </button>

    <div class="field" id="field-username">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <span class="field-error">아이디를 입력해 주세요.</span>
    </div>
    <div class="field" id="field-password">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <span class="field-error">비밀번호를 입력해 주세요.</span>
    </div>

    <button type="submit" class="submit" id="submitBtn">로그인</button>
    <p id="formError" class="form-error"></p>
  </form>
</div>

<footer>
  나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example
</footer>

<script>
  // FastAPI 백엔드 로그인 API 주소 (실제 배포 도메인으로 바꿔주세요)
  const API_BASE = 'https://backend-production-6b41.up.railway.app';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');
  const testLoginBtn = document.getElementById('testLoginBtn');

  async function doLogin(username, password, triggerBtn) {
    formError.style.display = 'none';
    document.querySelectorAll('.field.has-error').forEach(f => f.classList.remove('has-error'));

    const originalText = triggerBtn.textContent;
    triggerBtn.disabled = true;
    triggerBtn.textContent = '로그인 중…';

    try {
      const res = await fetch(API_BASE + '/api/facility/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        formError.textContent = err.detail || '아이디 또는 비밀번호가 올바르지 않습니다.';
        formError.style.display = 'block';
        triggerBtn.disabled = false;
        triggerBtn.textContent = originalText;
        return;
      }

      const facility = await res.json(); // { id, name, balance, ftype, channel, youtube_id }
      // bazaar.html이 기대하는 형식(n, t, c, v)으로 변환해서 저장
      const facForBazaar = {
        id: facility.id,
        n: facility.name,
        t: facility.ftype || '',
        c: facility.channel || '',
        v: facility.youtube_id || '',
        balance: facility.balance
      };
      localStorage.setItem('nb_facility', JSON.stringify(facForBazaar));
      // 잔액도 bazaar.html이 쓰는 키(nb_balance_시설명)에 맞춰 저장
      localStorage.setItem('nb_balance_' + facility.name, String(facility.balance));
      location.href = 'bazaar.html';
    } catch (err) {
      formError.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
      formError.style.display = 'block';
      triggerBtn.disabled = false;
      triggerBtn.textContent = originalText;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    let firstInvalid = null;
    if (!username) firstInvalid = firstInvalid || 'username';
    if (!password) firstInvalid = firstInvalid || 'password';
    if (firstInvalid) {
      document.getElementById('field-' + firstInvalid).classList.add('has-error');
      return;
    }

    doLogin(username, password, submitBtn);
  });

  testLoginBtn.addEventListener('click', () => {
    document.getElementById('username').value = 'test';
    document.getElementById('password').value = 'test';
    doLogin('test', 'test', testLoginBtn);
  });
</script>
</body>
</html>
