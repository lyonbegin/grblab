<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/fonts.css">
<title>로그인 | 나눔이음바자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<style>
  @font-face{
    font-family:'Jalnan';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#FBF7F7;--paper-2:#F6EFEE;--ink:#2B2430;--ink-soft:#6B5F68;--ink-faint:#A79AA0;
    --red:#EE6F93;--red-dark:#C94F71;--thread:#45BC92;--thread-soft:#DEF6EC;
    --line:#F0E1E6;--card:#FFFFFF;--r-lg:22px;--r-md:14px;--r-sm:10px;--wrap:420px;
    --sans:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --serif:'Jalnan','Gowun Batang','Nanum Myeongjo',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

  .dnav{position:sticky;top:0;z-index:50;background:rgba(251,247,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .dnav-in{max-width:1040px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between}
  .dbrand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
  .dbrand em{font-style:normal;color:var(--red)}
  .dback{font-size:13.5px;color:var(--ink-soft);text-decoration:none}

  .head{padding:44px 0 8px;text-align:center}
  .head .tag{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1F5344;
    background:var(--thread-soft);padding:7px 16px;border-radius:100px;margin-bottom:16px;
  }
  .head h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .head p{font-size:13.5px;color:var(--ink-soft)}

  .field{margin:22px 0}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:8px}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:13px 15px;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--card);outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--thread)}
  .field.has-error input{border-color:#C0392B}
  .field-error{color:#C0392B;font-size:12.5px;margin-top:6px;display:none}
  .field.has-error .field-error{display:block}

  .submit{
    display:block;width:100%;background:var(--thread);color:#fff;border:0;
    padding:14px;font-size:15.5px;font-weight:700;border-radius:var(--r-sm);
    cursor:pointer;font-family:inherit;transition:background .15s;margin-top:6px;
  }
  .submit:hover{background:#2E9C79}
  .submit:disabled{opacity:.6;cursor:default}

  .form-error{color:#C0392B;font-size:13px;text-align:center;margin-top:14px;display:none}

  footer{background:var(--ink);color:var(--ink-faint);padding:30px 24px;font-size:12.5px;text-align:center;margin-top:60px}

/* =========================================================
   공통 글로벌 헤더
   ========================================================= */
.global-header{
  height:78px;
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,250,247,.84);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(115,84,68,.08);
}
.global-header *{box-sizing:border-box}
.global-header .g-shell{
  width:min(calc(100% - 48px),1180px);
  height:100%;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:28px;
}
.global-brand{
  font-family:var(--font-display,'Jalnan',sans-serif)!important;
  font-size:27px!important;
  font-weight:400!important;
  letter-spacing:-.08em!important;
  line-height:1!important;
  white-space:nowrap;
  color:#11192a!important;
  text-decoration:none!important;
}
.global-brand span{color:#11192a!important;font:inherit!important}
.global-brand b{color:#f4476b!important;font:inherit!important;font-weight:400!important}
.global-nav-links{
  display:flex;
  align-items:center;
  gap:28px;
  margin-left:auto;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
}
.global-nav-links a{
  position:relative;
  color:#11192a!important;
  opacity:.78;
  font:inherit!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-nav-links a:hover{opacity:1}
.global-nav-links a.is-current{color:#f4476b!important;opacity:1}
.global-nav-links a.is-current::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-12px;
  height:2px;border-radius:999px;background:#ee6f93;
}
.global-header-cta{
  margin-left:6px;
  padding:10px 17px!important;
  border-radius:999px!important;
  background:#11192a!important;
  color:#fff!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:12px!important;
  font-weight:700!important;
  letter-spacing:-.025em!important;
  line-height:1.2!important;
  text-decoration:none!important;
  white-space:nowrap;
}
.global-menu-btn{
  display:none;
  margin-left:auto;
  width:40px;height:40px;
  border:0;background:transparent;padding:8px;cursor:pointer;
}
.global-menu-btn span{
  display:block;height:2px;margin:6px 0;background:#11192a;border-radius:999px;
}
.global-mobile-nav{
  display:none;
  position:fixed;
  z-index:1001;
  left:14px;right:14px;top:72px;
  padding:12px;
  border:1px solid rgba(102,79,67,.14);
  border-radius:20px;
  background:#fff;
  box-shadow:0 24px 60px rgba(58,42,32,.11);
}
.global-mobile-nav.open{display:block}
.global-mobile-nav a{
  display:block;
  padding:14px;
  border-radius:10px;
  color:#11192a!important;
  font-family:var(--font-ui,'Pretendard','SUIT',system-ui,sans-serif)!important;
  font-size:13px!important;
  font-weight:700!important;
  text-decoration:none!important;
}
.global-mobile-nav a:hover{background:#f6efee}
.global-mobile-nav a.is-current{color:#f4476b!important}

/* 페이지별 원래 바자 서브메뉴 */
.bazaar-subnav{
  position:sticky;
  top:78px;
  z-index:900;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line,#F0E1E6);
}
.bazaar-subnav-in{
  width:min(calc(100% - 48px),1180px);
  min-height:56px;
  margin-inline:auto;
  display:flex;
  align-items:center;
  gap:18px;
  font-family:var(--sans,'SUIT Variable','SUIT',sans-serif);
}
.bazaar-subnav a{text-decoration:none}
.subnav-back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:0 12px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.subnav-back:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.subnav-back svg{width:14px;height:14px}

.bazaar-main-links{
  display:flex;
  align-items:center;
  gap:8px;
}
.bazaar-main-links a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-main-links a:hover{
  background:var(--paper-2,#F6EFEE);
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-links a.on{
  background:var(--ink,#2B2430);
  color:#fff!important;
}
.bazaar-main-account{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.bazaar-main-account #whoName{
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink-soft,#6B5F68);
  font-size:12.5px;
  font-weight:700;
}
.bazaar-main-account .account-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
}
.bazaar-main-account .cart-ico{
  position:relative;
  width:36px;height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink,#2B2430)!important;
}
.bazaar-main-account .cart-ico svg{width:20px;height:20px}
.bazaar-main-account .logout-btn{
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:var(--paper-2,#F6EFEE);
  color:var(--ink-soft,#6B5F68);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  line-height:1;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
}

.bazaar-intro-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.bazaar-intro-actions a{
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:0 13px;
  border-radius:999px;
  color:var(--ink-soft,#6B5F68)!important;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.bazaar-intro-actions a.primary{
  background:var(--ink,#2B2430);
  color:#fff!important;
}

@media(max-width:980px){
  .global-nav-links,.global-header-cta{display:none}
  .global-menu-btn{display:block}
}
@media(max-width:760px){
  .global-header{height:66px}
  .global-header .g-shell{width:calc(100% - 24px)}
  .global-brand{font-size:24px!important}
  .global-mobile-nav{top:66px;left:12px;right:12px}

  .bazaar-subnav{top:66px}
  .bazaar-subnav-in{
    width:100%;
    min-height:52px;
    padding:7px 12px;
  }

  .bazaar-subnav.main .bazaar-subnav-in{
    min-height:92px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  .bazaar-main-links{
    width:100%;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .bazaar-main-links::-webkit-scrollbar{display:none}
  .bazaar-main-links a{
    min-height:34px;
    padding:0 12px;
    font-size:12.5px;
    flex:none;
  }
  .bazaar-main-account{
    width:100%;
    margin-left:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .bazaar-main-account #whoName{
    flex:1 1 auto;
    min-width:0;
    max-width:none;
    font-size:12px;
  }
  .bazaar-main-account .account-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
  }
  .subnav-back{
    min-height:34px;
    padding:0 10px;
    font-size:12.5px;
  }
  .bazaar-intro-actions{
    width:100%;
    justify-content:flex-end;
    gap:6px;
  }
  .bazaar-intro-actions a{
    min-height:34px;
    padding:0 11px;
    font-size:12.5px;
  }
}

</style>
</head>
<body>

<header class="global-header">
  <div class="g-shell">
    <a class="global-brand" href="../nanumieum_portal.html" aria-label="나눔이음 메인">
      <span>나눔</span><b>이음</b>
    </a>
    <nav class="global-nav-links" aria-label="나눔이음 주요 메뉴">
      <a href="../nanumieum_portal.html#cases">대표 이음 사례</a>
      <a href="../nanumieum_portal.html#together">후원과 세금혜택</a>
      <a href="../nanumieum_portal.html#archive">나눔 아카이브</a>
      <a class="is-current" href="bazaar.html" aria-current="page">나눔이음바자</a>
      <a href="../hpartners.html">병원동행 파트너스</a>
    </nav>
    <button type="button" class="global-menu-btn" id="globalMenuBtn" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="global-mobile-nav" id="globalMobileNav" aria-label="모바일 글로벌 메뉴">
    <a href="../nanumieum_portal.html#cases">대표 이음 사례</a>
    <a href="../nanumieum_portal.html#together">후원과 세금혜택</a>
    <a href="../nanumieum_portal.html#archive">나눔 아카이브</a>
    <a class="is-current" href="bazaar.html" aria-current="page">나눔이음바자</a>
    <a href="../hpartners.html">병원동행 파트너스</a>
  </nav>
</header>

<nav class="bazaar-subnav" aria-label="로그인 메뉴">
  <div class="bazaar-subnav-in">
    <a href="index.html" class="subnav-back">← 나눔이음바자 홈</a>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <span class="tag">복지시설 로그인</span>
    <h1>결연 복지시설로 로그인</h1>
    <p>협의체에 등록된 복지시설만 나눔이음바자를 이용할 수 있습니다.</p>
  </div>

  <form id="loginForm">
    <button type="button" class="submit test-login" id="testLoginBtn" style="background:var(--ink-faint);margin-bottom:18px">
      나눔이음지역아동센터 테스트 시설로 로그인하기
    </button>

    <div class="field" id="field-username">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <span class="field-error">아이디를 입력해 주세요.</span>
    </div>
    <div class="field" id="field-password">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <span class="field-error">비밀번호를 입력해 주세요.</span>
    </div>

    <button type="submit" class="submit" id="submitBtn">로그인</button>
    <p id="formError" class="form-error"></p>
  </form>
</div>

<footer>
  나눔이음 사회복지시설 협의체 · 지역 복지시설과 크리에이터를 잇는 나눔 프로젝트 · 문의 look@nanumieum.example
</footer>

<script>

  (() => {
    const btn = document.getElementById('globalMenuBtn');
    const nav = document.getElementById('globalMobileNav');
    if(!btn || !nav) return;
    btn.addEventListener('click', ()=>{
      const open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    });
    nav.querySelectorAll('a').forEach(link=>{
      link.addEventListener('click', ()=>{
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      });
    });
    document.addEventListener('click', e=>{
      if(!e.target.closest('.global-header')){
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded','false');
        btn.setAttribute('aria-label','메뉴 열기');
      }
    });
  })();


  // FastAPI 백엔드 로그인 API 주소 (실제 배포 도메인으로 바꿔주세요)
  const API_BASE = 'https://backend-production-6b41.up.railway.app';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');
  const testLoginBtn = document.getElementById('testLoginBtn');

  async function doLogin(username, password, triggerBtn) {
    formError.style.display = 'none';
    document.querySelectorAll('.field.has-error').forEach(f => f.classList.remove('has-error'));

    const originalText = triggerBtn.textContent;
    triggerBtn.disabled = true;
    triggerBtn.textContent = '로그인 중…';

    try {
      const res = await fetch(API_BASE + '/api/facility/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        formError.textContent = err.detail || '아이디 또는 비밀번호가 올바르지 않습니다.';
        formError.style.display = 'block';
        triggerBtn.disabled = false;
        triggerBtn.textContent = originalText;
        return;
      }

      const facility = await res.json(); // { id, name, balance, ftype, channel, youtube_id }
      // bazaar.html이 기대하는 형식(n, t, c, v)으로 변환해서 저장
      const facForBazaar = {
        id: facility.id,
        n: facility.name,
        t: facility.ftype || '',
        c: facility.channel || '',
        v: facility.youtube_id || '',
        balance: facility.balance
      };
      localStorage.setItem('nb_facility', JSON.stringify(facForBazaar));
      // 잔액도 bazaar.html이 쓰는 키(nb_balance_시설명)에 맞춰 저장
      localStorage.setItem('nb_balance_' + facility.name, String(facility.balance));
      location.href = 'bazaar.html';
    } catch (err) {
      formError.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
      formError.style.display = 'block';
      triggerBtn.disabled = false;
      triggerBtn.textContent = originalText;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    let firstInvalid = null;
    if (!username) firstInvalid = firstInvalid || 'username';
    if (!password) firstInvalid = firstInvalid || 'password';
    if (firstInvalid) {
      document.getElementById('field-' + firstInvalid).classList.add('has-error');
      return;
    }

    doLogin(username, password, submitBtn);
  });

  testLoginBtn.addEventListener('click', () => {
    document.getElementById('username').value = 'test';
    document.getElementById('password').value = 'test';
    doLogin('test', 'test', testLoginBtn);
  });
</script>
</body>
</html>
