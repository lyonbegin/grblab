<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>장면 생성 엔진 프로토타입</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c2c2a;
    --ink-soft: #5f5e5a;
    --paper: #faf7f0;
    --paper-card: #ffffff;
    --line: #ddd8ca;
    --forest: #3b6d11;
    --forest-deep: #27500a;
    --forest-pale: #eaf3de;
    --amber: #ba7517;
    --amber-pale: #faeeda;
    --coral: #d85a30;
    --coral-pale: #fae7e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 28px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin: 16px 0 6px; }
  textarea, input[type=text] {
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper-card);
    color: var(--ink);
    resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--forest); }
  .goal-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; margin-bottom: 10px; }
  .goal-tag {
    font-size: 12px; font-weight: 700; text-align: center; padding: 8px 0; border-radius: 6px;
  }
  .tag-kor { background: var(--forest-pale); color: var(--forest-deep); }
  .tag-eng { background: var(--amber-pale); color: #633806; }
  .tag-math { background: var(--coral-pale); color: #712b13; }
  .tag-book { background: #e6f1fb; color: #0c447c; }
  .book-info { display: none; }
  .book-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .book-card {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--paper-card); cursor: pointer; text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .book-card:hover { border-color: var(--forest); }
  .book-card.selected { border-color: var(--forest); background: var(--forest-pale); }
  .book-card .tier {
    flex: none; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 5px;
    background: #e6f1fb; color: #0c447c; white-space: nowrap;
  }
  .book-card.selected .tier { background: var(--forest); color: #fff; }
  .book-card .book-title { font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .book-card:disabled, .book-card.empty { opacity: 0.4; cursor: default; pointer-events: none; }
  select {
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper-card);
    color: var(--ink);
  }
  select:focus { outline: none; border-color: var(--forest); }
  .goal-detail { font-size: 12px; color: var(--ink-soft); margin-top: 4px; padding-left: 2px; }
  .level-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .level-row span { font-size: 11.5px; color: var(--ink-soft); flex: none; }
  .level-btns { display: flex; gap: 4px; }
  .level-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--paper-card); color: var(--ink-soft); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .level-btn.selected { background: var(--forest); border-color: var(--forest); color: #fff; }
  button.primary {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.primary:hover { background: var(--forest-deep); }
  button.primary:disabled { background: #b4b2a9; cursor: default; }
  #setup { display: block; }
  #stage { display: none; }
  .progress { display: flex; gap: 8px; margin-bottom: 20px; }
  .pill {
    flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 8px 4px;
    border-radius: 20px; border: 1.5px solid var(--line); color: var(--ink-soft);
  }
  .pill.done { border-color: var(--forest); background: var(--forest-pale); color: var(--forest-deep); }
  .pill.active { border-color: var(--amber); background: var(--amber-pale); color: #633806; }
  .story-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 26px;
    margin-bottom: 18px;
  }
  .story-card p {
    font-family: 'Noto Serif KR', serif;
    font-size: 16.5px;
    line-height: 1.85;
    margin: 0 0 14px;
  }
  .story-card p:last-child { margin-bottom: 0; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left;
    padding: 13px 16px;
    background: var(--paper-card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .choice-btn:hover { border-color: var(--forest); background: var(--forest-pale); }
  .choice-btn:disabled { opacity: 0.5; cursor: default; }
  .choice-btn.test-correct { border-color: var(--forest); border-width: 2px; background: var(--forest-pale); }
  .choice-btn.test-correct::after { content: '정답(테스트)'; float: right; font-size: 11px; font-weight: 700; color: var(--forest-deep); }
  .loading { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 20px 0; }
  .scene-end {
    text-align: center; font-size: 13px; color: var(--forest-deep); font-weight: 700;
    background: var(--forest-pale); padding: 14px; border-radius: 10px; margin-bottom: 18px;
  }
  .err { color: var(--coral); font-size: 13px; margin-top: 10px; }
  .debug-strip {
    font-size: 11.5px; color: var(--ink-soft); background: #f1efe8; border: 1px dashed var(--line);
    border-radius: 8px; padding: 8px 10px; margin: -8px 0 14px; line-height: 1.6;
  }
  .debug-strip b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">

  <div id="setup">
    <h1>장면 생성 엔진 프로토타입</h1>
    <p class="sub">교과 챕터를 고르면 그 챕터의 핵심 개념을 뿌리로 한 세계관이 자동 구성됩니다. 국영수 목표 3개를 더하면, 하나의 사건 속에서 네 트랙이 얽히는 장면이 생성됩니다.</p>

    <label>영역</label>
    <select id="bookArea" onchange="onAreaChange()"></select>

    <label>학습 챕터 (교과 단원)</label>
    <select id="bookChapter" onchange="onChapterChange()"></select>

    <label>세계관의 기반이 될 책 (하나 선택)</label>
    <div class="book-cards" id="bookCards"></div>

    <div class="goal-row">
      <div class="goal-tag tag-kor">국어</div>
      <div>
        <select id="goalKor" onchange="showDetail('kor')"></select>
        <div class="goal-detail" id="detailKor"></div>
        <div class="level-row"><span>난이도</span><div class="level-btns" id="levelKor"></div></div>
      </div>
    </div>
    <div class="goal-row">
      <div class="goal-tag tag-eng">영어</div>
      <div>
        <select id="goalEng" onchange="showDetail('eng')"></select>
        <div class="goal-detail" id="detailEng"></div>
        <div class="level-row"><span>난이도</span><div class="level-btns" id="levelEng"></div></div>
      </div>
    </div>
    <div class="goal-row">
      <div class="goal-tag tag-math">수학</div>
      <div>
        <select id="goalMath" onchange="showDetail('math')"></select>
        <div class="goal-detail" id="detailMath"></div>
        <div class="level-row"><span>난이도</span><div class="level-btns" id="levelMath"></div></div>
      </div>
    </div>

    <button class="primary" id="startBtn" onclick="startScene()">장면 시작</button>
    <div class="err" id="setupErr"></div>
  </div>

  <div id="stage">
    <h1 id="stageTitle">장면 진행 중</h1>
    <div class="progress">
      <div class="pill" id="pillKor">국어</div>
      <div class="pill" id="pillEng">영어</div>
      <div class="pill" id="pillMath">수학</div>
    </div>
    <div id="storyLog"></div>
    <div id="loadingBox" class="loading" style="display:none;">이야기를 쓰는 중...</div>
    <div class="err" id="stageErr"></div>
  </div>

</div>

<script>

function populateAreas() {
  const areaSel = document.getElementById('bookArea');
  const areas = [...new Set(BOOKS_DATA.map(b => b.area))];
  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    areaSel.appendChild(opt);
  });
}
function populateChapters() {
  const area = document.getElementById('bookArea').value;
  const chSel = document.getElementById('bookChapter');
  chSel.innerHTML = '';
  BOOKS_DATA.forEach((b, idx) => {
    if (b.area !== area) return;
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `[${b.grade}] ${b.chapter}`;
    chSel.appendChild(opt);
  });
}
let selectedBookTier = null; // 'intro' | 'main' | 'deep'

function renderBookCards() {
  const idx = document.getElementById('bookChapter').value;
  const b = BOOKS_DATA[idx];
  selectedBookTier = null;
  const wrap = document.getElementById('bookCards');
  wrap.innerHTML = '';
  const tiers = [
    { key: 'intro', label: '입문', text: b.intro },
    { key: 'main', label: '대표', text: b.main },
    { key: 'deep', label: '심화', text: b.deep }
  ];
  tiers.forEach(t => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'book-card' + (t.text ? '' : ' empty');
    card.innerHTML = `<span class="tier">${t.label}</span><span class="book-title">${t.text || '(해당 없음)'}</span>`;
    if (t.text) card.onclick = () => selectBookCard(t.key, card);
    wrap.appendChild(card);
    if (t.key === 'main' && t.text) {
      selectBookCard('main', card);
    }
  });
}
function selectBookCard(tierKey, cardEl) {
  selectedBookTier = tierKey;
  document.querySelectorAll('.book-card').forEach(c => c.classList.remove('selected'));
  cardEl.classList.add('selected');
}
function onAreaChange() { populateChapters(); renderBookCards(); }
function onChapterChange() { renderBookCards(); }

function goalLabel(subject, item) {
  if (subject === 'math') {
    return `[${item.part} ${item.category}] ${item.title}`;
  }
  return `[${item.major} ${item.mid}] ${item.title}`;
}
function goalFullText(subject, item) {
  if (subject === 'math') {
    return `${item.title} (${item.part} / ${item.category}, 난이도 ${item.difficulty}) — 출제 경향: ${item.trend}`;
  }
  return `${item.title} (${item.major} / ${item.mid}, 권장학습단계 ${item.stage}, 중요도 ${item.importance}) — ${item.content}`;
}
function populateSelect(selectId, subject) {
  const sel = document.getElementById(selectId);
  GOALS_DATA[subject].forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = goalLabel(subject, item);
    sel.appendChild(opt);
  });
}
function showDetail(which) {
  const subjectMap = { kor: 'kor', eng: 'eng', math: 'math' };
  const subject = subjectMap[which];
  const sel = document.getElementById('goal' + which[0].toUpperCase() + which.slice(1));
  const item = GOALS_DATA[subject][sel.value];
  document.getElementById('detail' + which[0].toUpperCase() + which.slice(1)).textContent = goalFullText(subject, item);
}
let levelState = { kor: 3, eng: 3, math: 3 };
function renderLevelButtons(which) {
  const wrap = document.getElementById('level' + which[0].toUpperCase() + which.slice(1));
  wrap.innerHTML = '';
  for (let lv = 1; lv <= 5; lv++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'level-btn' + (lv === levelState[which] ? ' selected' : '');
    btn.textContent = lv;
    btn.onclick = () => { levelState[which] = lv; renderLevelButtons(which); };
    wrap.appendChild(btn);
  }
}
window.addEventListener('DOMContentLoaded', () => {
  populateAreas();
  populateChapters();
  renderBookCards();
  populateSelect('goalKor', 'kor');
  populateSelect('goalEng', 'eng');
  populateSelect('goalMath', 'math');
  showDetail('kor'); showDetail('eng'); showDetail('math');
  renderLevelButtons('kor'); renderLevelButtons('eng'); renderLevelButtons('math');
});

- 너는 이 대화의 이전 메시지들(네가 이전에 만든 장면, 아이의 선택들)을 모두 기억하고 있다. 매 응답은 절대 새로 시작하지 말고, 직전까지 쌓인 세계관·등장인물·사건·트랙 진행 상황을 정확히 이어받아 계속 진행해야 한다.
- 아이의 선택은 반드시 구체적인 다음 사건으로 이어져야 한다. 같은 상황을 다른 말로 반복하거나 제자리걸음하지 마라. 매 응답마다 이야기는 반드시 한 걸음 앞으로 나아가야 한다 (실패든 깨달음이든 적용이든, 이전 상태와 다른 새로운 국면이어야 한다).
- 특정 트랙이 "완주" 상태가 되면 그 트랙의 개념으로 절대 다시 돌아가지 말고, 다음 미완주 트랙으로 넘어가라.

세계관 구축 원칙 (SELECTED_BOOK 기반):
- 입력으로 주어지는 것은 완성된 이야기가 아니라 교과 챕터 안에서 사용자가 직접 고른 책 한 권(저자+제목)이다. 이 책이 다루는 핵심 주제·개념·시대적 문제의식을 뿌리로 삼아 아이가 몰입할 수 있는 **완전히 새로운 허구의 세계관과 등장인물을 매번 창작**하라. 이 책의 실제 문장이나 구체적 서술을 절대 요약·인용하지 말고, 그 책이 다루는 주제의 핵심 아이디어와 정신만 흡수해 원작과 무관한 독자적 이야기를 만들어라.
- 세계관은 이 책의 핵심 개념이 "왜 필요한가"를 자연스럽게 체험할 수 있는 배경이어야 한다. 예를 들어 뉴턴의 프린키피아라면 중력과 운동 법칙이 세계의 규칙인 곳에서 벌어지는 탐험 이야기처럼, 책의 핵심 개념 자체가 서사적 갈등의 재료가 되게 하라.
- 이렇게 만든 세계관 안에서 국어·영어·수학 목표 3개의 결핍 상황도 함께 자연스럽게 얽어 넣는다. 즉 장면 하나에 책의 핵심 개념(배경) + 국영수 목표 3개(사건의 결핍)가 공존한다.
- 매 장면(scene)마다 세계관과 등장인물의 일관성을 유지하되, 첫 장면에서는 세계관 자체도 새로 소개해야 한다.

절대 원칙 — 기원 원리 (가장 중요, 모든 개념에 예외 없이 적용):
- 학습목표를 받으면 먼저 스스로에게 물어라: "이 개념이 아예 존재하지 않던 시절, 인류(혹은 어떤 언어·학문의 최초 사람들)는 어떤 구체적 상황에서 처음으로 이 답답함을 느꼈을까?" 이 답을 찾기 전에는 장면을 쓰지 마라.
- 장면 속 등장인물(아이가 이입하는 캐릭터)은 단순히 "오늘 이 문제를 겪는 사람"이 아니라, **이 개념이 세상에 아직 없던 바로 그 최초의 순간에 서 있는 사람**이어야 한다. 즉 아이는 이야기 속에서 그 개념을 처음 필요로 한 최초의 인류·조상·발견자 그 자체가 된다. "옛날 사람이 이런 걸 겪었대"라고 전해 듣는 구조가 아니라, 아이 자신이 지금 그 문제에 직접 부딪힌 최초의 당사자여야 한다.
- 목표는 개념을 설명하거나 이해시키거나 암기시키는 것이 아니라, 아이가 스스로 "아~ 그래서 이게 필요했던 거구나"하고 무릎을 탁 치는 그 한 순간에 도달하게 만드는 것이다. 그 순간 이후에는 더 설명하지 말고 바로 다음으로 넘어가라.
- 이 기원의 순간은 짧아야 한다. 결핍 발생 → 선택 1~2회 → 깨달음, 이 안에 끝내라. 하나의 개념에 3턴 이상 끌지 마라. 아이가 깨달음에 도달하면 그 즉시 짧게 매듭짓고 다음 과목으로 넘어간다.
- origin_reason은 그 과목·언어의 고유한 구조적 이유에서 나와야 한다. "완전한 뜻을 전달하지 못해 혼란스러웠다"처럼 국어든 영어든 수학이든 갖다 붙일 수 있는 범용 문장은 절대 금지다. 예를 들어 영어의 주어-동사 필수성은 한국어처럼 문맥상 주어를 생략할 수 없다는 영어 고유의 제약에서 나와야 하고, 국어의 서술어 자릿수는 국어 특유의 조사 체계·생략 가능성과 연결되어야 한다. 같은 장면 안의 국어/영어/수학 origin_reason 세 개를 나란히 놓았을 때, 서로 다른 과목처럼 뚜렷이 구별되지 않으면 실패다.
- 트랙마다 서사적 장치(오브젝트, 상황, 소재)를 다르게 써라. 같은 장면 안에서 국어 트랙에 썼던 소재(예: 고장난 기계와 쪽지)를 영어나 수학 트랙에서 형태만 바꿔 반복하지 마라. 세 트랙은 같은 세계관·등장인물을 공유하되, 각각 고유한 사건·소재로 결핍을 겪게 하라.
- 적용 확인 질문은 반드시 그 트랙의 학습목표가 실제로 요구하는 판단을 묻는 문제여야 한다. 목표가 "서술어 자릿수"라면 문항도 자릿수 판단을 묻는 것이어야지, 문맥상 어느 문장이 상황에 맞는지를 묻는 독해 문제로 대체하지 마라. 적용 문제를 쓰기 전에 "이 질문이 정말 이 학습목표를 검증하는가?"를 스스로 점검하라.
- 턴 수를 줄이라는 규칙이 내용의 밀도까지 줄이라는 뜻은 아니다. 한 턴(narration) 안에서 등장인물이 그럴듯한 방법을 두세 번 직접 시도해보고 스스로 그 시도들의 한계를 깨닫는 과정을 보여준 뒤에 선택지로 좁혀도 된다. "빨리 끝내기 위해" 밋밋하게 압축하지 말고, 턴 수는 적게 가져가되 한 턴 안의 사고 밀도는 풍부하게 채워라.

결핍턴 vs 발명턴 — 정답 사전 노출 절대 금지 (가장 자주 어기는 규칙, 각별히 주의):
- 한 트랙이 시작되는 첫 턴을 "결핍턴"이라 부른다. 결핍턴의 narration과 선택지 어디에도 개념 이름, 공식, 문법 용어, 이미 완성된 정답 형태를 절대 등장시키지 마라. origin_reason 필드는 너 혼자 참고할 내부 판단 근거일 뿐이다 — 그 문장이나 그 문장이 담은 원리를 narration에 그대로 옮겨 적거나 풀어 설명하지 마라. 결핍턴은 오직 "막혀서 답답한 상황"만 보여준다.
- 결핍턴의 선택지는 반드시 "무엇을 해야 할까?"라는 전략·방향을 고르는 것이어야 한다. 이미 문법적으로 완성되고 옳은 문장/식을 선택지로 제시해 아이가 골라내기(정답 인식)만 하게 만들면 안 된다.
  - 나쁜 예 (정답을 선택지에 숨겨서 알아보게 함): "1) She had gone before he arrived  2) She has gone before he arrived  3) She go before he arrived" — 이미 정답이 섞인 완성 문장 중 고르는 것은 결핍턴에서 금지.
  - 좋은 예 (전략을 고르게 함): "1) 반복해서 강조한다  2) 직접 겨뤄본다  3) 원래 단어에 뭔가를 덧붙여 새 신호를 만든다" — 어떤 방향으로 문제를 풀지 고르는 것.
  - 또 다른 나쁜 예 (선택지 문구 안에 진단·설명을 끼워 넣음): "Find out WHO runs fast — the message is missing the one who acts." 처럼 행동 뒤에 "— 왜냐하면 ~가 빠졌기 때문이다"식 설명을 덧붙이면, 행동을 고르는 척하면서 실은 정답 진단을 그대로 알려주는 것이다. 결핍턴 선택지는 순수한 행동/시도만 담아야 하며, 그 행동이 왜 필요한지에 대한 이유·진단·설명은 선택지 문구에 단 한 글자도 포함시키지 마라. 그 이유는 오직 다음 턴(발명턴)에서 결과로 드러나야 한다. (올바른 예: "Find out WHO runs fast" 까지만 — 뒤의 설명은 삭제.)
  - 수학도 동일하다: 결핍턴에서 공식이나 풀이 절차를 먼저 알려주지 마라. "왜 이 계산이 막히는가"만 겪게 하고, 해결 전략(예: "숫자를 고정한다" vs "문자로 자리를 만든다")을 고르게 하라.
- 전략을 고른 다음 턴을 "발명턴"이라 부른다. 여기서 비로소 구체적인 형태(정확한 단어 변형, 정확한 식의 표기 등)를 아이가 만들어보게 한다. 이때는 2~3개의 그럴듯한 후보 형태를 선택지로 주고 그중 하나를 고르게 해도 된다 — 이건 "설명 듣고 확인"이 아니라 "직접 만들어보는 발명의 순간"이기 때문에 괜찮다. 다람쥐 같은 조력자 캐릭터가 원리를 대신 설명해버리지 말고, 아이의 선택이 곧 발명이 되게 하라.
- 요약하면 순서는 반드시 이렇다: (1) 결핍을 말없이 겪는다 → (2) 전략을 고른다 → (3) 그 전략을 구체적 형태로 발명해본다 → (4) 짧게 적용해본다. 원리 설명이 정답 노출보다 먼저 나오는 순간이 있다면 그것 자체가 규칙 위반이다.

모범 예시 (참고용 — 이 자체를 베끼지 말고, 이 정도의 깊이·자연스러운 대사·사고 밀도를 목표로 삼아라):
아래는 "비교 구문"을 다룬 좋은 예시다. 토끼와 거북이가 각자 "빠르다"고 우기다가, 같은 단어로는 누가 더 빠른지 비교할 수 없다는 걸 깨닫는다. 등장인물이 "빠르다-그리고-거북이보다?", "거북이보다-빠르다?"처럼 스스로 두 번 그럴듯한 시도를 해보고 그 한계를 깨달은 뒤에야 "기존 단어에 신호만 붙이면 되지 않을까"라는 진짜 통찰에 도달한다. 대사는 자연스러운 큰따옴표를 그대로 쓴다: "거북아, 나는 빠르다니까!" "나도 빠른데." 이렇게 한 턴 안에 여러 시도와 반전이 있어야 "아 그래서 이게 필요했구나"가 진짜로 느껴진다. 매 트랙의 origin_reason과 서사도 이 정도의 구체성과 밀도를 갖춰야 한다.

절대 원칙 — 기타:
- "다음 중 옳은 것을 고르시오" 식 지식 확인형 질문 금지. 개념 이름/문법 용어를 먼저 제시하는 것 금지. 용어는 항상 깨달음 이후에만 등장.
- 오답 선택지는 명백히 틀린 게 아니라 그럴듯하되 서사적으로 반드시 벽에 부딪히게 설계.
- 채점 언어("틀렸습니다") 금지. 실패는 항상 사건으로 전개.
- 세 트랙을 분리된 챕터로 나누지 말 것. 하나의 사건 안에서 세 결핍이 자연스럽게 얽히게 할 것.

언어 전환 규칙 (매우 중요):
- 국어 트랙과 수학 트랙에 해당하는 narration/선택지는 한국어로 작성한다.
- 영어 트랙(ENGLISH_GOAL)에 해당하는 narration 구간과 그 구간의 선택지는 반드시 영어로 작성한다. 영어 학습이므로 지문 자체가 영어여야 의미가 있다. 다만 선택을 유도하는 짧은 지시문("Choose one" 등)이나 정말 필요한 경우의 보조 설명에는 한글을 섞어도 된다.
- 한 장면 안에서 국어/수학 구간은 한국어, 영어 구간은 영어로 자연스럽게 전환되는 것은 정상이다. 전환 시 어색하지 않게 문단을 분리하라.

난이도 레벨 규칙 (KOREAN_LEVEL / ENGLISH_LEVEL / MATH_LEVEL, 각 1~5) — 반드시 지켜야 하는 하드 제약:
- 레벨은 이 시스템 프롬프트의 다른 모든 지시(세계관의 배경 소재, 목표 개념의 원래 난이도, 서사의 정교함)보다 우선한다. 목표 개념 자체가 어려운 고급 개념(예: 로피탈 정리, 가정법 과거완료)이라도, 레벨이 낮으면 그 개념을 다루는 상황·비유·문장을 극도로 단순화해야 한다. "개념이 원래 어려우니까 레벨을 지켜도 어쩔 수 없다"는 절대 핑계가 되지 않는다. 레벨 1이면 초등 저학년도 읽을 수 있을 만큼 쉬워야 한다 — 예외 없다.
- 레벨별 구체 기준 (문단당 문장 수, 문장 길이, 어휘):
  - 레벨 1: 문단 1~2문장. 한 문장은 8단어(영어) 또는 15자(한국어) 이내. 접속사·조건절·비유 없이 "A가 B했다" 식 단문만. 개념을 설명할 때도 숫자·구체적 사물로만 보여주고 추상어를 쓰지 마라.
  - 레벨 2: 문단 2~3문장. 문장은 12단어(영어)/25자(한국어) 이내. "그리고/그런데/because/and" 정도의 접속사만.
  - 레벨 3: 문단 3~4문장. 약간의 복문 허용, 일반 어휘.
  - 레벨 4: 문단 4~5문장. 복문과 개념어 일부 포함.
  - 레벨 5: 문단 5문장 이상. 복잡한 문장 구조와 추상적 개념어 허용.
- 세계관 자체(SELECTED_BOOK 기반 배경, 등장인물 설정)는 레벨과 무관하게 유지해도 되지만, 그 세계관 안에서 벌어지는 사건의 서술 방식·문장 복잡도는 반드시 레벨을 따라야 한다. 배경이 '중력 군도'처럼 복잡한 개념이어도, 레벨 1이면 그걸 아주 쉬운 문장으로 풀어 써야 한다.
- 국어/영어/수학 각 트랙은 자신의 레벨 값만 따르고, 트랙마다 레벨이 다를 수 있다는 점에 유의하라 (예: 국어는 레벨 4인데 영어는 레벨 1일 수 있음).
- narration을 다 쓴 뒤 스스로 검토하라: "이 레벨의 아이가 사전 없이 이 문단을 끝까지 읽고 이해할 수 있는가?" 아니라면 다시 써라.

동료로서 함께 헤매기 원칙 (설명 금지, 매우 중요):
- 그 누구도 — 주인공도, 조력자 캐릭터(다람쥐 같은 도우미)도 — 이미 답을 알고 있는 "선생님"처럼 굴면 안 된다. 조력자도 처음엔 똑같이 헷갈려하고, 같이 시도해보고, 같이 틀리기도 해야 한다. 관계는 "가르치는 사람 → 배우는 사람"이 아니라 "함께 문제를 풀어가는 동료"여야 한다.
- 사전적 정의를 읊는 문장(예: "벽에 이렇게 적혀 있었다: '~란 ~을 말한다'", "다람쥐가 말했다: '이건 ~라고 해'")으로 개념을 통째로 설명해버리는 것을 금지한다. 이런 식의 정리성 문장은 설명이지 발견이 아니다.
- 발명턴에서 아이가 스스로 형태를 만들어내거나 맞힌 뒤에도, 조력자는 정답을 "정의"하지 말고 그저 짧게 맞장구치거나("오, 그거네!", "어? 진짜 되네") 함께 신기해하는 정도로만 반응하라. 개념 이름이 꼭 필요하면 한 문장으로 아주 짧게 이름만 붙이는 정도로 그치고, 그 이상의 부연 설명을 늘어놓지 마라.
- 판단 기준: 이 턴에서 아이가 아무것도 안 하고 캐릭터의 말을 읽기만 해도 개념을 다 알게 된다면 실패다. 아이의 선택이 없었다면 그 이해에 도달할 수 없었어야 한다.

장면 내부 순서 (국어→영어→수학 순으로 순환, 각 과목당 1~2턴 이내 완결):
1. 오프닝: 세계관 소개, 개념 언급 없음.
2. 첫 번째 미완주 과목의 "기원 상황"에 아이를 최초의 당사자로 세운다 → 그럴듯한 선택지 제시.
3. 선택에 따라 딱 한 번(많아야 두 번) 벽에 부딪힌 뒤, 바로 깨달음 트리거로 넘어간다. 여기서 처음 용어/방법이 등장해도 좋다.
4. 적용 확인 선택형 질문 1개 → 맞히면 해당 트랙 완주, 짧게 매듭짓고 즉시 다음 미완주 과목의 기원 상황으로 전환한다. 같은 과목에서 시간을 더 끌지 마라.
5. 세 트랙 모두 완주되면 장면을 종료하고 다음 장면으로의 짧은 전환을 제시한다.

반드시 아래 JSON 형식으로만 응답하라. 다른 텍스트를 앞뒤에 절대 붙이지 마라. 필드 순서를 반드시 지켜라 — origin_reason과 active_track을 먼저 채워서 스스로 생각을 정리한 뒤 narration을 써라.
{
  "origin_reason": "지금 이 턴이 다루는 과목·개념에 대해 — 이 개념이 아예 없던 시절, 최초의 인류/조상은 구체적으로 어떤 상황에서 이 답답함을 처음 느꼈는가. 1~2문장. 이미 그 과목이 완주 상태라면 빈 문자열. 주의: 이 필드는 오직 네 내부 판단 근거이며 아이에게 절대 보여지지 않는다. 이 내용이나 그 원리를 narration에 그대로 옮겨 적거나 미리 설명해버리면 안 된다 — narration은 오직 결핍 상황만 보여줘야 한다.",
  "active_track": "korean|english|math 중 이번 턴이 실제로 다루고 있는 과목 하나. 세 트랙이 모두 완주되어 장면이 끝나는 턴이면 마지막으로 완주 처리한 과목을 넣는다.",
  "narration": "서사 단락들 (문단 사이는 \\n\\n으로 구분, 2~5문단)",
  "choices": ["선택지1", "선택지2", "선택지3"],
  "correct_index": 0,
  "track_status": {"korean": "미시작|실패반복|깨달음직전|완주", "english": "...", "math": "..."},
  "scene_complete": false
}
choices는 장면이 완전히 끝났을 때만 빈 배열([])로 둘 수 있다. scene_complete가 true면 narration에 다음 장면으로의 전환 문장을 포함하고 choices는 빈 배열로 둔다.
correct_index는 choices 배열에서 서사를 다음 단계(실패 없이 깨달음/적용 방향)로 가장 잘 진행시키는 선택지의 0부터 시작하는 인덱스다. choices가 빈 배열이면 correct_index는 0으로 둔다. 이 값은 테스트 목적으로만 쓰이며 아이에게 보이지 않으니 정직하게 표시하라.

트랙 전환 강제 규칙 (매우 중요):
- 매 입력값에 TRACK_TURN_COUNT가 함께 주어진다. 이는 active_track이 될 각 과목에서 지금까지 몇 번의 턴을 썼는지를 나타낸다.
- 특정 과목의 TRACK_TURN_COUNT가 이미 2 이상인데 아직 완주되지 않았다면, 이번 응답에서 무조건 그 과목의 깨달음과 적용을 마무리하고 완주 처리하라. 절대 세 번째 실패나 추가 선택지를 만들지 마라. 즉시 매듭짓고 다음 미완주 과목으로 넘어가라.
- 한 과목에서 절대 3턴을 넘기지 마라. 이것은 유연한 권장이 아니라 반드시 지켜야 하는 하드 리밋이다.

JSON 형식 엄수 규칙 (매우 중요):
- narration 문자열 안에서 문단을 나눌 때 실제 줄바꿈 문자를 넣지 말고 반드시 \\n\\n 이스케이프 시퀀스로만 표기하라.
- narration이나 choices 문자열 안에서 대사를 표시할 때 자연스러운 큰따옴표("...")를 그대로 사용해도 된다. 단, JSON 문자열 안에서 큰따옴표는 반드시 \\"로 이스케이프하라 (예: "narration": "토끼가 \\"나는 빠르다니까!\\"라고 말했어요."). 이스케이프를 빼먹으면 파싱이 깨진다.
- 유효한 JSON 문법을 반드시 지켜라: 모든 문자열은 큰따옴표로 감싸고, 문자열 내부의 백슬래시나 큰따옴표는 반드시 이스케이프하라.`;

let state = {
  chapterArea: '', chapterGrade: '', chapterTitle: '', selectedBook: '', selectedTierLabel: '', goals: {}, levels: { kor: 3, eng: 3, math: 3 }, messages: [], trackStatus: {korean:'미시작', english:'미시작', math:'미시작'}, trackTurnCounts: {korean:0, english:0, math:0}, sceneComplete: false
};

function buildInitialUserMessage() {
  return `[입력값 — 이 장면의 고정 정보. 이후 대화 내내 유지할 것]
CHAPTER_AREA: ${state.chapterArea}
CHAPTER_GRADE: ${state.chapterGrade}
CHAPTER_TITLE: ${state.chapterTitle}
SELECTED_BOOK (${state.selectedTierLabel} 단계): ${state.selectedBook} — 이 책의 핵심 주제·개념의 정신만 흡수해 세계관을 창작할 것. 원문 요약·인용 금지.
KOREAN_GOAL: ${state.goals.kor}
KOREAN_LEVEL: ${state.levels.kor} (1=가장 쉬움 ~ 5=가장 어려움)
ENGLISH_GOAL: ${state.goals.eng}
ENGLISH_LEVEL: ${state.levels.eng} (1=가장 쉬움 ~ 5=가장 어려움)
MATH_GOAL: ${state.goals.math}
MATH_LEVEL: ${state.levels.math} (1=가장 쉬움 ~ 5=가장 어려움)
TRACK_STATUS: ${JSON.stringify(state.trackStatus)}
TRACK_TURN_COUNT: ${JSON.stringify(state.trackTurnCounts)}

위 세계관 구축 원칙, 절대 원칙, 언어 전환 규칙, 난이도 레벨 규칙, 트랙 전환 강제 규칙, 장면 내부 순서를 따라 첫 단락(오프닝)을 생성하라. 아직 선택은 없었다. 새로운 허구의 세계관과 등장인물을 이번 응답에서 창작해 오프닝을 시작하라. JSON만 출력하라.`;
}

function buildChoiceUserMessage(choiceText) {
  return `아이가 선택했다: "${choiceText}"

지금까지의 대화(직전 장면, 등장인물, 세계관, 진행 상황)를 그대로 이어받아 다음 단락을 생성하라. 절대 새로 시작하지 말고, 방금 아이가 고른 선택의 직접적 결과로 이어지는 사건을 전개하라. 현재 트랙 상태: ${JSON.stringify(state.trackStatus)}. 현재 TRACK_TURN_COUNT: ${JSON.stringify(state.trackTurnCounts)} — 어느 과목이든 이미 2 이상이면 이번 응답에서 반드시 마무리하고 완주 처리하라. 위 세계관 구축 원칙, 절대 원칙, 언어 전환 규칙, 난이도 레벨 규칙, 트랙 전환 강제 규칙, 장면 내부 순서를 계속 따르라. JSON만 출력하라.`;
}

function sanitizeJSONText(text) {
  // 문자열 리터럴 내부의 실제 개행/탭 문자를 이스케이프 시퀀스로 치환해 깨진 JSON을 복구한다.
  let out = '';
  let inString = false;
  let escape = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escape) { out += ch; escape = false; continue; }
      if (ch === '\\') { out += ch; escape = true; continue; }
      if (ch === '"') { inString = false; out += ch; continue; }
      if (ch === '\n') { out += '\\n'; continue; }
      if (ch === '\r') { continue; }
      if (ch === '\t') { out += '\\t'; continue; }
      out += ch;
      continue;
    }
    if (ch === '"') { inString = true; out += ch; continue; }
    out += ch;
  }
  return out;
}

function parseModelJSON(rawText) {
  const clean = rawText.trim().replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
  try {
    return JSON.parse(clean);
  } catch (e1) {
    try {
      return JSON.parse(sanitizeJSONText(clean));
    } catch (e2) {
      throw e1; // 원본 오류를 보여줌
    }
  }
}

// state.messages는 전체 기록을 그대로 보관하되(디버깅/추후 요약용),
// API에는 항상 "첫 메시지(세계관·목표 설정) + 최근 N개"만 보내 컨텍스트가 무한정 쌓이지 않게 한다.
const MAX_RECENT_MESSAGES = 12; // 최근 대화 최대 개수 (사용자+모델 합산, 대략 6턴)
function getMessagesForAPI() {
  if (state.messages.length <= MAX_RECENT_MESSAGES + 1) return state.messages;
  const first = state.messages[0];
  const recent = state.messages.slice(-MAX_RECENT_MESSAGES);
  // 윈도우에 밀려난 구간이 있다는 걸 모델에게 알려 혼란을 줄인다.
  const bridgeNote = { role: "user", content: "[안내] 오래된 대화 일부는 길이 제한으로 생략되었다. 위 첫 메시지의 세계관·목표 설정과 아래 최근 대화를 기준으로 계속 이어가라. 지금까지 진행된 트랙 상태를 존중하고 이미 완주된 트랙으로 되돌아가지 마라." };
  return [first, bridgeNote, ...recent];
}

async function callRaw(messages) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1600,
      system: SYSTEM_PROMPT,
      messages: messages
    })
  });
  const data = await response.json();
  const textBlock = data.content.find(b => b.type === "text");
  if (!textBlock) throw new Error("응답에 텍스트가 없습니다.");
  return textBlock.text;
}

// state.messages에 이미 이번 턴의 user 메시지가 push되어 있다고 가정하고 호출한다.
// 성공하면 assistant 응답을 state.messages에 영구히 추가해 다음 턴에도 맥락이 이어지게 한다.
async function getSceneUpdate() {
  const rawText = await callRaw(getMessagesForAPI());
  try {
    const parsed = parseModelJSON(rawText);
    state.messages.push({ role: "assistant", content: rawText });
    return parsed;
  } catch (e) {
    // JSON이 깨졌으면 교정 지시를 임시로 붙여 한 번만 재시도한다.
    const retryNote = { role: "user", content: '[주의] 직전 응답이 유효한 JSON이 아니었다. narration 문자열 안의 줄바꿈은 반드시 \\n\\n 이스케이프 시퀀스로만 표기하고, 실제 줄바꿈 문자를 절대 넣지 마라. 대사에 큰따옴표를 쓸 경우 반드시 \\" 로 이스케이프하라. 유효한 JSON만 다시 출력하라.' };
    const retryMessages = [...getMessagesForAPI(), retryNote];
    const retryRawText = await callRaw(retryMessages);
    const parsed = parseModelJSON(retryRawText); // 실패하면 여기서 던져짐
    state.messages.push(retryNote, { role: "assistant", content: retryRawText });
    return parsed;
  }
}

function updatePills() {
  const map = {korean: 'pillKor', english: 'pillEng', math: 'pillMath'};
  for (const key in map) {
    const el = document.getElementById(map[key]);
    el.classList.remove('done', 'active');
    const s = state.trackStatus[key];
    if (s === '완주') el.classList.add('done');
    else if (s === '실패반복' || s === '깨달음직전') el.classList.add('active');
  }
}

function renderStory(result) {
  const log = document.getElementById('storyLog');

  const debug = document.createElement('div');
  debug.className = 'debug-strip';
  const trackLabel = {korean:'국어', english:'영어', math:'수학'}[result.active_track] || result.active_track || '-';
  const isDone = result.track_status && result.track_status[result.active_track] === '완주';
  const turnLabel = isDone ? '완주' : `턴 ${state.trackTurnCounts[result.active_track] ?? '-'}/2`;
  debug.innerHTML = `<b>[테스트용 디버그]</b> 현재 트랙: <b>${trackLabel}</b> (${turnLabel})`
    + (result.origin_reason ? `<br><b>기원 질문:</b> ${result.origin_reason}` : '');
  log.appendChild(debug);

  const card = document.createElement('div');
  card.className = 'story-card';
  result.narration.split('\n\n').forEach(p => {
    if (p.trim()) {
      const pEl = document.createElement('p');
      pEl.textContent = p.trim();
      card.appendChild(pEl);
    }
  });
  log.appendChild(card);

  if (result.scene_complete) {
    const end = document.createElement('div');
    end.className = 'scene-end';
    end.textContent = '장면 완료 — 세 트랙 모두 완주했습니다.';
    log.appendChild(end);
    return;
  }

  const choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';
  result.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (i === result.correct_index ? ' test-correct' : '');
    btn.textContent = (i + 1) + '. ' + c;
    btn.onclick = () => makeChoice(c, choicesDiv);
    choicesDiv.appendChild(btn);
  });
  log.appendChild(choicesDiv);
  log.scrollTop = log.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
}

function applyResult(result) {
  state.trackStatus = result.track_status;
  const at = result.active_track;
  if (at && state.trackTurnCounts.hasOwnProperty(at)) {
    if (state.trackStatus[at] === '완주') {
      state.trackTurnCounts[at] = 0; // 완주되면 카운트는 더 이상 의미 없으니 리셋
    } else {
      state.trackTurnCounts[at] += 1;
    }
  }
  updatePills();
}

async function makeChoice(choiceText, choicesDiv) {
  Array.from(choicesDiv.children).forEach(b => b.disabled = true);
  state.messages.push({ role: "user", content: buildChoiceUserMessage(choiceText) });
  document.getElementById('loadingBox').style.display = 'block';
  document.getElementById('stageErr').textContent = '';
  try {
    const result = await getSceneUpdate();
    applyResult(result);
    renderStory(result);
  } catch (e) {
    document.getElementById('stageErr').textContent = '오류: ' + e.message;
  } finally {
    document.getElementById('loadingBox').style.display = 'none';
  }
}

async function startScene() {
  const chIdx = document.getElementById('bookChapter').value;
  const ch = BOOKS_DATA[chIdx];
  state.chapterArea = ch.area;
  state.chapterGrade = ch.grade;
  state.chapterTitle = ch.chapter;

  if (!selectedBookTier) {
    document.getElementById('setupErr').textContent = '세계관의 기반이 될 책을 하나 선택해주세요.';
    return;
  }
  const tierLabelMap = { intro: '입문', main: '대표', deep: '심화' };
  state.selectedBook = ch[selectedBookTier];
  state.selectedTierLabel = tierLabelMap[selectedBookTier];

  const korIdx = document.getElementById('goalKor').value;
  const engIdx = document.getElementById('goalEng').value;
  const mathIdx = document.getElementById('goalMath').value;
  state.goals = {
    kor: goalFullText('kor', GOALS_DATA.kor[korIdx]),
    eng: goalFullText('eng', GOALS_DATA.eng[engIdx]),
    math: goalFullText('math', GOALS_DATA.math[mathIdx])
  };
  state.levels = { kor: levelState.kor, eng: levelState.eng, math: levelState.math };
  state.trackStatus = {korean:'미시작', english:'미시작', math:'미시작'};
  state.trackTurnCounts = {korean:0, english:0, math:0};

  document.getElementById('setupErr').textContent = '';
  document.getElementById('startBtn').disabled = true;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('stage').style.display = 'block';
  document.getElementById('stageTitle').textContent = `${state.chapterTitle} · ${state.selectedBook}`;
  document.getElementById('loadingBox').style.display = 'block';

  state.messages = [{ role: "user", content: buildInitialUserMessage() }];

  try {
    const result = await getSceneUpdate();
    applyResult(result);
    renderStory(result);
  } catch (e) {
    document.getElementById('stageErr').textContent = '오류: ' + e.message;
  } finally {
    document.getElementById('loadingBox').style.display = 'none';
  }
}
</script>
</body>
</html>
